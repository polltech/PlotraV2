services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: plotra-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plotra_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plotrav2_plotra_network

  backend:
    build: ./backend
    container_name: plotra-backend
    environment:
      PLOTRA_DATABASE__HOST: postgres
      PLOTRA_DATABASE__PORT: 5432
      PLOTRA_DATABASE__USERNAME: postgres
      PLOTRA_DATABASE__PASSWORD: postgres
      PLOTRA_DATABASE__NAME: plotra_db
      PLOTRA_APP__DEBUG: "false"
      PLOTRA_APP__ENV: "production"
      PLOTRA_APP__FRONTEND_BASE_URL: "https://dev.plotra.eu"
      PLOTRA_APP__SECRET_KEY: your-super-secret-key-change-this-in-production
      PLOTRA_CORS__ALLOWED_ORIGINS: '["https://dev.plotra.eu","https://plotra.eu","https://www.plotra.eu"]'
      PLOTRA_MOBILE__API_KEY: 6bc3e8e7894720a5d12412888ffc3725fcb9eded6307a704a5dd7920a10ea90d
      PLOTRA_MOBILE__RATE_LIMIT_PER_MINUTE: 60
      UVICORN_WORKERS: 2
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - plotrav2_plotra_network
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips='*'

  dashboard:
    build: ./frontend/dashboard
    container_name: plotra-dashboard
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - plotrav2_plotra_network

  wordpress-db:
    image: mysql:8.0
    container_name: plotra-wordpress-db
    environment:
      MYSQL_ROOT_PASSWORD: plotra_wp_root_2024
      MYSQL_DATABASE: orderifi_wp283
      MYSQL_USER: orderifi_wp283
      MYSQL_PASSWORD: "7fT!5SCp]7"
    volumes:
      - wordpress_db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - plotrav2_plotra_network

  wordpress:
    image: wordpress:php8.1-apache
    container_name: plotra-wordpress
    volumes:
      - ./plotra:/var/www/html
    depends_on:
      - wordpress-db
    restart: unless-stopped
    networks:
      - plotrav2_plotra_network

  nginx-proxy:
    image: nginx:alpine
    container_name: plotra-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /root/ssl-certs:/etc/nginx/ssl:ro
    depends_on:
      - dashboard
      - backend
      - wordpress
    restart: unless-stopped
    networks:
      - plotrav2_plotra_network

volumes:
  postgres_data:
  uploads_data:
  wordpress_db_data:

networks:
  plotrav2_plotra_network:
    external: true

